<nav class="sidebar">
  <div style="padding-bottom: 16px;">
    <strong>Navigation</strong>
  </div>
  {% for p in site.pages %}
    {% if p.title and p.autonav != false %}
      <a class="nav-link {% if p.url == page.url %}active{% endif %}" href="{{ p.url | relative_url }}">
        {{ p.title }}
      </a>
    {% endif %}
  {% endfor %}
</nav>
