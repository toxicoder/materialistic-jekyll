title: Materialistic Jekyll Theme
description: A Material Design 3 Jekyll theme for technical documentation.
baseurl: "/materialistic-jekyll"
url: https://toxicoder.github.io

theme_settings:
  palette: "palette-1" # Default palette (1-50)

markdown: kramdown
permalink: pretty

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

defaults:
  - scope:
      path: "docs"
    values:
      layout: "doc"

# Extra CSS and JS files to include
extra_css: []
extra_javascript: []
